[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TINTOlib"
version = "1.3.0"
authors = [
    { name="BorjaRei", email="borjareinoso@gmail.com" },
    { name= "manwestc", email="jcastillo@fi.upm.es"},
    { name= "DavidGonzalezFernandez", email="david.g.f.2@gmail.com"},
    { name= "JiayunLiu", email="jiayun.liu@upm.es"},
    { name="JavierLopez", email="javilecrin19@gmail.com"}
]
description = "Converting tabular data into images"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "bitstring>=4.0,<5",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "Pillow>=9.5,<13",
    "scikit-learn>=1.2,<2",
    "scipy>=1.10,<2",
    "tqdm>=4.65,<5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
greedy = [
    "asymmetric-greedy-search==0.1.0",
    "numba>=0.60,<0.61; python_version < '3.10'",
    "numba>=0.62,<0.63; python_version >= '3.10'",
]
refined = [
    "mpi4py>=4,<5",
]
all = [
    "asymmetric-greedy-search==0.1.0",
    "numba>=0.60,<0.61; python_version < '3.10'",
    "numba>=0.62,<0.63; python_version >= '3.10'",
    "mpi4py>=4,<5",
]

[project.urls]
"Homepage" = "https://github.com/oeg-upm/TINTOlib"
"Documentation" = "https://tintolib.readthedocs.io/"
"Benchmarks" = "https://oeg-upm.github.io/TINTOlib/"
"Repository" = "https://github.com/oeg-upm/TINTOlib"
"Issues" = "https://github.com/oeg-upm/TINTOlib/issues"

[tool.hatch.build.targets.wheel]
packages = ["TINTOlib"]

[tool.hatch.build.targets.sdist]
include = [
    "/TINTOlib",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
