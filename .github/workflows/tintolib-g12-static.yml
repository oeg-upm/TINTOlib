# CANDIDATE ONLY - NOT INSTALLED IN THE REPOSITORY.
# Requires an explicit, limited GO for any Git commit, push, or workflow run.
# One push event, one matrix run: no duplicate pull_request trigger.
# This workflow performs structural checks; no imports of TINTOlib and no tests/FIT/MPI/build.
name: G12 static source validation - TINTOlib 1.4.0 candidate

on:
  push:
    branches:
      - release/v1.4.0-g5-local-20261120

permissions:
  contents: read

concurrency:
  group: g12-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      TEST_ACCESS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout event ref with no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse Python and validate static release metadata only
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import ast
          import json
          import sys
          import tomllib
          from pathlib import Path

          def require(condition: bool, code: str):
              if not condition:
                  raise SystemExit('G12_HOLD_' + code)

          require(sys.version_info[:2] in ((3, 11), (3, 14)), 'PYTHON_MATRIX')
          package = Path('TINTOlib')
          tests = Path('tests')
          require(package.is_dir() and tests.is_dir(), 'SOURCE_LAYOUT')

          py_files = sorted(package.rglob('*.py')) + sorted(tests.glob('test_*.py'))
          require(len(py_files) >= 5, 'PYTHON_FILES_MISSING')
          for path in py_files:
              require(path.is_file() and not path.is_symlink(), 'SOURCE_FILE_TYPE')
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except (SyntaxError, UnicodeError) as exc:
                  raise SystemExit('G12_HOLD_AST_' + str(path)) from exc
          print('G12_PYTHON_AST_ONLY_PASS', len(py_files))

          metadata = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          project = metadata['project']
          require(project.get('name') == 'TINTOlib', 'PACKAGE_NAME')
          require(project.get('version') == '1.4.0', 'PACKAGE_VERSION')
          require(project.get('requires-python') == '>=3.9', 'PYTHON_REQUIRES')
          classifiers = project.get('classifiers', [])
          require('Programming Language :: Python :: 3.14' in classifiers, 'CLASSIFIER_314')
          extras = project.get('optional-dependencies', {})
          require(all(name in extras for name in ('greedy', 'refined', 'all')), 'EXTRAS')
          for name in ('greedy', 'all'):
              require(any("python_version >= '3.14'" in item and 'numba' in item
                          for item in extras[name]), 'NUMBA_MARKER_' + name)
          for name in ('refined', 'all'):
              require(any("python_version >= '3.14'" in item and 'numpy' in item
                          for item in extras[name]), 'NUMPY_MARKER_' + name)
          require('/tests' in metadata['tool']['hatch']['build']['targets']['sdist']['include'],
                  'SDIST_TEST_DECLARATION')
          print('G12_TOML_EXTRAS_AND_SDIST_CONTRACT_PASS')

          tree = ast.parse((package / 'bie.py').read_text(encoding='utf-8'))
          cls = next((node for node in tree.body
                      if isinstance(node, ast.ClassDef) and node.name == 'BIE'), None)
          require(cls is not None, 'BIE_CLASS')
          constructor = next((node for node in cls.body
                              if isinstance(node, ast.FunctionDef) and node.name == '__init__'), None)
          require(constructor is not None, 'BIE_CONSTRUCTOR')
          args = constructor.args.posonlyargs + constructor.args.args
          names = [arg.arg for arg in args]
          require(bool(names) and names[-1] == 'correlated', 'BIE_CORRELATED_PARAMETER')
          require(bool(constructor.args.defaults)
                  and isinstance(constructor.args.defaults[-1], ast.Constant)
                  and constructor.args.defaults[-1].value is True, 'BIE_DEFAULT_TRUE')
          declared_tests = ast.parse((tests / 'test_cbie_v140_integration.py').read_text(encoding='utf-8'))
          test_count = sum(isinstance(node, ast.FunctionDef) and node.name.startswith('test_')
                           for klass in declared_tests.body if isinstance(klass, ast.ClassDef)
                           for node in klass.body)
          require(test_count == 14, 'CBIE_TEST_DECLARATIONS')
          print('G12_BIE_API_AND_14_TEST_DECLARATIONS_PASS')

          codemeta = json.loads(Path('codemeta.json').read_text(encoding='utf-8'))
          require(codemeta.get('softwareVersion') == '1.4.0', 'CODEMETA_VERSION')
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          require('version: "1.4.0"' in cff, 'CITATION_VERSION')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          require('1.4.0' in changelog, 'CHANGELOG_VERSION')
          print('G12_DOCUMENT_VERSION_CONSISTENCY_PASS')
          print('G12_STATIC_CI_ONLY_PASS_NO_IMPORT_NO_FIT_NO_TEST_NO_BUILD_NO_MPI')
          PY
